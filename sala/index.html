<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#120E2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Estante · Sala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Paleta "Noite suave" (a mesma do app e do Palavreiro) */
    --bg: #120E2B; --card: #231C48; --card2: #2F275C; --line: #4A4180;
    --text: #F4F1FF; --muted: #A9A2D0; --accent: #9B8CFF; --on-accent: #1A1438; --red: #E5737A; --green: #5FB873; --yellow: #E6C14F;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { overflow: hidden; }
  html, body { margin: 0; height: 100%; background: linear-gradient(#2A2058, #120E2B) fixed, var(--bg); color: var(--text); font-family: Outfit, system-ui, -apple-system, sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  /* A sala ocupa só a parte visível da tela: com o teclado aberto ela encolhe (o player fica no lugar). */
  #room.on { position: fixed; left: 0; right: 0; top: var(--vv-top, 0px); height: var(--vv-h, 100dvh); }
  /* Sala aberta: a página não rola (o Safari não consegue mais empurrar o layout). */
  body.in-room { position: fixed; inset: 0; overflow: hidden; }
  /* Teclado aberto (igual à referência): player menor no topo, bolinhas por cima do vídeo,
     chat no meio e a caixa de texto colada no teclado. */
  body.kb .player { aspect-ratio: auto; height: min(56.25vw, calc(var(--vv-h, 100dvh) * 0.34)); padding-top: 0; }
  body.kb .mini { display: none; }
  #pdots { position: absolute; left: 10px; top: 10px; display: none; z-index: 2; pointer-events: none; }
  #pdots span { position: relative; width: 30px; height: 30px; border-radius: 50%; margin-right: -8px; border: 2px solid rgba(0,0,0,.6); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #1A1438; }
  #pdots span i { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); font-size: 10px; font-style: normal; }
  body.kb #pdots { display: flex; }
  body.kb #chat { padding-top: 8px; }
  button { font-family: inherit; }

  /* Entrada */
  #join { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px; text-align: center; gap: 14px; }
  .shelf { display: flex; gap: 8px; align-items: flex-end; height: 74px; }
  .shelf i { display: block; width: 34px; border-radius: 5px; box-shadow: 0 6px 14px rgba(0,0,0,.5); }
  .shelf i:nth-child(1) { height: 60px; background: linear-gradient(#5FB873, #2f6b3c); }
  .shelf i:nth-child(2) { height: 72px; background: linear-gradient(#E6C14F, #8a6f22); }
  .shelf i:nth-child(3) { height: 60px; background: linear-gradient(#9B8CFF, #5546a8); transform: rotate(8deg); transform-origin: bottom; }
  .plank { width: 170px; height: 14px; border-radius: 5px; background: linear-gradient(#7468C4 0 40%, #453B8A 40%, #2A2260); margin-top: -2px; box-shadow: 0 8px 14px rgba(0,0,0,.45); }
  h1 { margin: 10px 0 0; font-size: 30px; font-weight: 800; }
  .sub { color: var(--muted); font-size: 15px; max-width: 320px; line-height: 1.4; }
  .movie { color: var(--accent); font-weight: 600; }
  input[type=text] {
    width: 100%; max-width: 320px; padding: 14px 18px; border-radius: 18px; border: 1.5px solid var(--line);
    background: var(--card); color: var(--text); font: inherit; font-size: 17px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  .btn { border: 0; border-radius: 999px; padding: 14px 28px; background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 600; cursor: pointer; }
  .btn:disabled { opacity: .45; }
  .err { color: var(--red); font-size: 14px; max-width: 320px; }

  /* Sala */
  #room { display: none; flex: 1; flex-direction: column; min-height: 0; overflow: hidden; }
  .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; flex: none; padding-top: env(safe-area-inset-top); box-sizing: content-box; }
  video { width: 100%; height: 100%; display: block; background: #000; }
  .overlay { position: absolute; inset: 0; z-index: 4; display: none; align-items: center; justify-content: center; text-align: center; padding: 16px; background: rgba(10,7,30,.82); color: #fff; font-size: 15px; line-height: 1.4; }
  .overlay p { margin: 0 0 12px; }
  .overlay .btn { padding: 11px 22px; font-size: 15px; }
  .overlay.show { display: flex; }
  .card { margin: 12px; padding: 14px; border-radius: 24px; background: var(--card); flex: none; }
  .row { display: flex; align-items: center; gap: 10px; }
  .title { flex: 1; min-width: 0; }
  .title b { display: block; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title span { color: var(--accent); font-size: 13px; font-weight: 600; }
  .sync { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .sync.ok::before { content: "●"; color: var(--green); margin-right: 5px; }
  .sync.off::before { content: "●"; color: var(--red); margin-right: 5px; }
  .people { display: flex; gap: 14px; overflow-x: auto; margin-top: 12px; padding-top: 10px; scrollbar-width: none; }
  .people::-webkit-scrollbar { display: none; }
  .person { width: 78px; flex: none; text-align: center; font-size: 11px; }
  .av { position: relative; width: 50px; height: 50px; margin: 0 auto 4px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: #1A1438; }
  .av.me { box-shadow: 0 0 0 2px rgba(255,255,255,.7); }
  .av .crown { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 15px; }
  .av .dot { position: absolute; right: -1px; bottom: -1px; width: 14px; height: 14px; border-radius: 50%; background: var(--green); border: 2px solid var(--card); }
  .person div:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .waiting { color: var(--muted); font-size: 13px; padding-top: 6px; }
  /* Teclado aberto: a faixa de quem está na sala vira uma linha só. */
  /* Quem está na sala: uma linha só */
  .mini { display: flex; align-items: center; gap: 10px; margin: 8px 12px; padding: 6px 12px 6px 8px; border-radius: 999px; background: var(--card); flex: none; }
  .mini .dots { display: flex; }
  .mini .dots span { position: relative; width: 32px; height: 32px; border-radius: 50%; margin-right: -9px; border: 2px solid var(--card); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #1A1438; }
  .mini .dots span i { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-size: 10px; font-style: normal; }
  .mini .names { flex: 1; min-width: 0; margin-left: 8px; display: flex; flex-direction: column; }
  .mini .names b { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .names > span { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.kb form { padding-bottom: 8px; }

  #chat { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 14px; display: flex; flex-direction: column; gap: 6px; -webkit-overflow-scrolling: touch; }
  .msg { display: flex; }
  .msg.mine { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 8px 12px; border-radius: 18px 18px 18px 4px; background: var(--card2); font-size: 15px; line-height: 1.35; word-wrap: break-word; }
  .msg.mine .bubble { background: var(--accent); color: var(--on-accent); border-radius: 18px 18px 4px 18px; }
  .bubble small { display: block; font-size: 12px; font-weight: 600; }
  .sys { text-align: center; color: var(--muted); font-size: 12px; padding: 2px 0; }
  .empty { text-align: center; color: var(--muted); opacity: .7; font-size: 13px; padding-top: 20px; }

  /* Reações e "digitando…" */
  .reacts { display: flex; justify-content: space-between; padding: 4px 12px 0; flex: none; }
  .reacts button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--card); font-size: 22px; line-height: 1; padding: 0; cursor: pointer; transition: transform .12s; }
  .reacts button:active { transform: scale(1.25); }
  body.kb .reacts { display: none; }
  #typing { display: none; align-items: center; gap: 8px; padding: 2px 18px; color: var(--muted); font-size: 12px; flex: none; }
  #typing.on { display: flex; }
  .dots { display: flex; gap: 3px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: hop .9s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes hop { 0%, 60%, 100% { transform: none; opacity: .5 } 30% { transform: translateY(-4px); opacity: 1 } }
  #floats { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
  .float { position: absolute; bottom: 30px; display: flex; flex-direction: column; align-items: center; animation: rise 2.6s cubic-bezier(.2,.6,.3,1) forwards; }
  .float b { font-size: 34px; line-height: 1; }
  .float span { margin-top: 2px; padding: 0 5px; border-radius: 6px; background: rgba(0,0,0,.45); color: #fff; font-size: 10px; }
  @keyframes rise {
    0% { transform: translate(0, 0) scale(.6); opacity: 0 }
    12% { opacity: 1; transform: translate(6px, -12%) scale(1.15) }
    50% { transform: translate(-10px, -55%) scale(1) }
    100% { transform: translate(8px, -110%) scale(1); opacity: 0 }
  }
  form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); flex: none; }
  form input { flex: 1; max-width: none; border-radius: 28px; border-color: transparent; }
  form button, form .pic { width: 48px; height: 48px; flex: none; border-radius: 50%; border: 0; background: var(--line); color: var(--muted); display: flex; align-items: center; justify-content: center; }
  form button.on { background: var(--accent); color: var(--on-accent); }
  form svg { width: 22px; height: 22px; }
  form .pic { background: var(--card); color: var(--accent); cursor: pointer; }
  form .pic.busy { opacity: .5; pointer-events: none; }
  #file { display: none; }
  .bubble.photo { padding: 4px; max-width: 70%; }
  .bubble.photo small { padding: 2px 8px 4px; }
  .bubble.photo .cap { padding: 4px 8px 4px; }
  .bubble img { display: block; width: 100%; max-width: 260px; max-height: 320px; object-fit: cover; border-radius: 12px; background: rgba(0,0,0,.25); cursor: zoom-in; }
  #viewer { position: fixed; inset: 0; z-index: 50; background: #000; display: none; align-items: center; justify-content: center; }
  #viewer.show { display: flex; }
  #viewer img { max-width: 100%; max-height: 100%; object-fit: contain; -webkit-touch-callout: default; }
  #viewer button { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 12px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.15); color: #fff; font-size: 22px; }
  #viewer p { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; color: rgba(255,255,255,.6); font-size: 12px; margin: 0; }

  /* Celular deitado de verdade (pela orientação da tela, não pela área visível — com o teclado
     aberto a área fica "larga" e isso não pode virar layout deitado). */
  body.land:not(.kb) #room { flex-direction: row; }
  body.land:not(.kb) .player { width: 62%; height: var(--vv-h, 100dvh); aspect-ratio: auto; padding-top: 0; }
  body.land:not(.kb) .side { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .side { display: flex; flex-direction: column; flex: 1; min-height: 0; }
</style>
</head>
<body>

<section id="join">
  <div class="shelf"><i></i><i></i><i></i></div>
  <div class="plank"></div>
  <h1>Assistir junto</h1>
  <p class="sub" id="joinText">Carregando a sala…</p>
  <input type="text" id="name" placeholder="Seu nome" maxlength="24" autocomplete="nickname" enterkeyhint="go">
  <button class="btn" id="enter" disabled>Entrar na sala</button>
  <p class="err" id="joinErr"></p>
</section>

<section id="room">
  <div class="player">
    <video id="video" playsinline controls preload="metadata"></video>
    <div class="overlay" id="overlay"></div>
    <div id="floats"></div>
    <div id="pdots"></div>
  </div>
  <div class="side">
    <div class="mini" id="mini">
      <div class="dots" id="miniDots"></div>
      <div class="names"><b id="miniNames"></b><span><span id="code"></span> · <span id="movie"></span></span></div>
      <div class="sync" id="sync">conectando…</div>
    </div>
    <div id="people" hidden></div>
    <div id="chat"><div class="empty">O chat da sala aparece aqui.</div></div>
    <div id="typing"><div class="dots"><i></i><i></i><i></i></div><span id="typingText"></span></div>
    <div class="reacts" id="reacts"></div>
    <form id="form" autocomplete="off">
      <label class="pic" id="pic" aria-label="Mandar foto"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm0 12H5l3.5-4.5 2.5 3 3.5-4.5L19 17ZM8.5 10A1.5 1.5 0 1 0 8.5 7a1.5 1.5 0 0 0 0 3Z"/></svg><input type="file" id="file" accept="image/*"></label>
      <input type="text" id="text" placeholder="Mensagem para a sala" maxlength="500" enterkeyhint="send" autocomplete="off" autocapitalize="sentences" dir="ltr">
      <button id="send" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z"/></svg></button>
    </form>
  </div>
</section>

<div id="viewer"><img id="viewerImg" alt="Foto"><button id="viewerClose" aria-label="Fechar">✕</button><p>Segure a foto para salvar</p></div>

<script src="mkv.js"></script>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);

  // ---------- Sala pelo link: #CODIGO@banco.firebaseio.com ----------
  const [code, host] = decodeURIComponent(location.hash.slice(1)).split("@");
  if (!code || !host || !/(firebaseio\.com|firebasedatabase\.app)$/.test(host)) {
    $("joinText").textContent = "Link incompleto. Peça o link da sala de novo.";
    return;
  }
  const ROOT = `https://${host}/salas/${code}`;
  const SV = { ".sv": "timestamp" };
  const me = sessionStorage.getItem("estante-id") || ("w-" + Math.random().toString(36).slice(2, 10));
  sessionStorage.setItem("estante-id", me);
  let myName = localStorage.getItem("estante-nome") || "";
  $("name").value = myName;

  const api = (method, path, body) =>
    fetch(`${ROOT}${path}.json`, { method, body: body === undefined ? undefined : JSON.stringify(body), keepalive: method === "DELETE" })
      .then((r) => { if (!r.ok) throw new Error("Firebase " + r.status); return r.json(); });

  // ---------- Cópia local da sala (mesma lógica do app) ----------
  let tree = null, loaded = false;
  const clone = (o) => (o && typeof o === "object" ? JSON.parse(JSON.stringify(o)) : o);
  function setAt(root, path, value) {
    const parts = path.split("/").filter(Boolean);
    if (!parts.length) return value;
    // Mexe na própria cópia (sem duplicar tudo a cada evento: com fotos no chat ficaria pesado).
    const top = root && typeof root === "object" ? root : {};
    let node = top;
    for (const p of parts.slice(0, -1)) { if (!node[p] || typeof node[p] !== "object") node[p] = {}; node = node[p]; }
    if (value === null) delete node[parts.at(-1)]; else node[parts.at(-1)] = value;
    return top;
  }
  function applyEvent(type, msg) {
    if (type === "put") tree = setAt(tree, msg.path, msg.data);
    else if (type === "patch") for (const k of Object.keys(msg.data || {})) tree = setAt(tree, msg.path.replace(/\/$/, "") + "/" + k, msg.data[k]);
  }

  // ---------- Relógio do servidor ----------
  let offset = 0;
  const serverNow = () => Date.now() + offset;

  // ---------- Player ----------
  // Comandos que chegam da sala mexem no vídeo; esses eventos NÃO podem voltar para a sala
  // (senão vira eco). Cada mexida nossa liga uma marca que o próximo evento daquele tipo consome.
  const video = $("video");
  let joined = false, lastState = null, lastRemoteKey = "", pendingSeek = null, unlocked = false;
  const ignore = { play: 0, pause: 0, seek: 0 };
  const mark = (k) => { ignore[k] = Date.now() + 4000; };
  const consume = (k) => { if (ignore[k] > Date.now()) { ignore[k] = 0; return true; } return false; };
  const expected = (s) => s.position + (s.playing ? Math.max(0, serverNow() - s.at) / 1000 : 0);

  function sendState(playing) {
    const s = { playing, position: video.currentTime, at: serverNow(), by: me, seq: Date.now() };
    lastState = s;
    api("PUT", "/state", s).catch(() => showConn(false));
  }
  /** Pula para [t] segundos — ou guarda para quando o vídeo tiver carregado o começo. */
  function seekTo(t, tolerance = 1) {
    if (!isFinite(t) || t < 0) return;
    if (video.readyState < 1) { pendingSeek = t; return; }
    if (Math.abs(video.currentTime - t) <= tolerance) return;
    mark("seek");
    video.currentTime = t;
  }
  function doPlay() {
    if (!video.paused) return Promise.resolve();
    mark("play");
    return video.play().then(() => { unlocked = true; hideOverlay(); }).catch((err) => {
      ignore.play = 0;
      if (err && err.name === "NotAllowedError") askTap();
      else if (video.error) showVideoError();
    });
  }
  function doPause() { if (!video.paused) { mark("pause"); video.pause(); } }
  function applyRemote(s) {
    lastState = s;
    seekTo(expected(s));
    if (s.playing) doPlay(); else doPause();
  }
  video.addEventListener("loadedmetadata", () => {
    if (pendingSeek == null) return;
    pendingSeek = null;
    if (lastState) seekTo(expected(lastState), 0.3);
  });
  video.addEventListener("play", () => { if (!consume("play") && joined) sendState(true); });
  video.addEventListener("pause", () => { if (!consume("pause") && joined && !video.seeking && !video.ended) sendState(false); });
  video.addEventListener("seeked", () => { if (!consume("seek") && joined) sendState(!video.paused); });
  video.addEventListener("error", () => {
    // O Safari não abre MKV sozinho: se o arquivo for MKV, troca para o conversor do site.
    if (!mkvTried && roomVideo && video.error && video.error.code >= 3) { probeMkv(roomVideo); return; }
    showVideoError();
  });

  // ---------- Fonte do vídeo (direto do Drive, ou MKV convertido na hora) ----------
  let roomVideo = null, mkv = null, mkvTried = false;
  const driveUrl = (v) => `https://www.googleapis.com/drive/v3/files/${v.fileId}?alt=media&supportsAllDrives=true&key=${v.key}`;
  const isMkv = (v) => /matroska/i.test(v.mime || "") || /\.mkv$/i.test(v.name || "");
  const canMse = () => !!(window.ManagedMediaSource || window.MediaSource) && !!window.EstanteMkv;
  function note(text) { systemLines.push({ at: serverNow(), text }); renderChat(); }
  function startSource(v) {
    roomVideo = v;
    if (mkv) { mkv.destroy(); mkv = null; }
    if ((isMkv(v) || mkvTried) && canMse()) startMkv(v);
    else { video.removeAttribute("src"); video.src = driveUrl(v); }
  }
  function startMkv(v) {
    mkvTried = true;
    if (mkv) mkv.destroy();
    mkv = EstanteMkv.MkvPlayer(video, driveUrl(v), {
      sizeUrl: `https://www.googleapis.com/drive/v3/files/${v.fileId}?fields=size&supportsAllDrives=true&key=${v.key}`,
      onError: (msg) => overlay(msg, "Tentar de novo", () => { hideOverlay(); retrySource(); }),
      onInfo: note,
      subtitles: !v.subtitleId,
    });
    if (!mkv) {
      overlay("Este navegador não consegue tocar MKV. No iPhone, precisa do iOS 17.1 ou mais novo (Ajustes › Geral › Atualização de Software).", "Tentar de novo", () => { hideOverlay(); retrySource(); });
    }
  }
  /** O arquivo veio sem nome (sala antiga): olha os primeiros bytes para ver se é MKV. */
  async function probeMkv(v) {
    mkvTried = true;
    try {
      if (!canMse()) throw 0;
      const r = await fetch(driveUrl(v), { headers: { Range: "bytes=0-3" } });
      if (!r.ok) throw 0;
      const b = new Uint8Array(await r.arrayBuffer());
      if (!EstanteMkv.looksLikeMkv(b)) throw 0;
    } catch (_) { showVideoError(); return; }
    startMkv(v);
    if (lastState) { pendingSeek = expected(lastState); if (lastState.playing) doPlay(); }
  }
  function retrySource() {
    if (!roomVideo) return;
    startSource(roomVideo);
    if (lastState) { pendingSeek = expected(lastState); applyRemote(lastState); }
  }

  function hideOverlay() { $("overlay").classList.remove("show"); }
  function overlay(html, button, onTap) {
    const o = $("overlay");
    o.innerHTML = `<div><p>${html}</p>${button ? `<button type="button" class="btn">${button}</button>` : ""}</div>`;
    o.classList.add("show");
    const b = o.querySelector("button");
    if (b) b.addEventListener("click", (e) => { e.stopPropagation(); onTap && onTap(); });
  }
  /** Navegador bloqueou o play automático: um toque resolve (é um gesto do usuário). */
  function askTap() {
    overlay("Toque para entrar no filme junto com a sala", "▶ Assistir junto", () => {
      hideOverlay();
      mark("play");
      video.play().then(() => {
        unlocked = true;
        if (lastState) { seekTo(expected(lastState)); if (!lastState.playing) doPause(); }
      }).catch(() => { ignore.play = 0; if (video.error) showVideoError(); else askTap(); });
    });
  }
  function showVideoError() {
    const code = video.error ? video.error.code : 0;
    const msg = code === 4
      ? "Este navegador não conseguiu abrir o filme. Ele precisa estar compartilhado no Drive como “qualquer pessoa com o link” e ser MP4, MOV ou MKV."
      : code === 3 ? "O filme abriu, mas este aparelho não consegue tocar esse formato (o mais seguro é MP4)."
      : "Não consegui baixar o filme do Drive. Confira a internet.";
    overlay(msg, "Tentar de novo", () => { hideOverlay(); retrySource(); });
  }

  // A cada 3 s confere se escorregou mais de 1,5 s e ajusta.
  setInterval(() => {
    renderPeople();
    if (!joined || !lastState || !lastState.playing || video.paused || video.seeking) return;
    seekTo(expected(lastState), 1.5);
  }, 3000);

  // ---------- Legenda (.srt → WebVTT, corrigindo acentos) ----------
  async function loadSubtitle(v) {
    if (!v.subtitleId) return;
    try {
      const r = await fetch(`https://www.googleapis.com/drive/v3/files/${v.subtitleId}?alt=media&supportsAllDrives=true&key=${v.key}`);
      if (!r.ok) return;
      const buf = await r.arrayBuffer();
      let text;
      try { text = new TextDecoder("utf-8", { fatal: true }).decode(buf); } catch { text = new TextDecoder("windows-1252").decode(buf); }
      text = text.replace(/^\uFEFF/, "");
      if (!text.trimStart().startsWith("WEBVTT")) text = "WEBVTT\n\n" + text.replace(/\r\n/g, "\n").replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, "$1.$2");
      const track = document.createElement("track");
      Object.assign(track, { kind: "subtitles", label: "Legenda", srclang: "pt", default: true, src: URL.createObjectURL(new Blob([text], { type: "text/vtt" })) });
      video.appendChild(track);
      track.addEventListener("load", () => { if (video.textTracks[0]) video.textTracks[0].mode = "showing"; });
    } catch (_) {}
  }

  // ---------- Pessoas e chat ----------
  const colors = ["#8E6BE8", "#E8836B", "#5FB8A3", "#E8C14F", "#6FA8E8", "#E56F9C"];
  const colorOf = (name) => { let h = 0; for (const c of name.toLowerCase()) h = (h * 31 + c.charCodeAt(0)) | 0; return colors[((h % colors.length) + colors.length) % colors.length]; };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let known = new Set(), systemLines = [];

  function online() {
    const p = (tree && tree.people) || {};
    return Object.entries(p).map(([id, v]) => ({ id, ...v })).filter((x) => serverNow() - (x.lastSeen || 0) < 25000)
      .sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  }
  function renderPeople() {
    if (!joined) return;
    const list = online();
    const ids = new Set(list.map((x) => x.id));
    if (known.size) {
      for (const x of list) if (!known.has(x.id) && x.id !== me) systemLines.push({ at: serverNow(), text: `${x.name} entrou na sala` });
      for (const id of known) if (!ids.has(id) && id !== me) { const n = tree?.people?.[id]?.name || "Alguém"; systemLines.push({ at: serverNow(), text: `${n} saiu` }); }
    }
    known = ids;
    const host = tree && tree.host;
    $("people").innerHTML = list.map((x) => `
      <div class="person">
        <div class="av ${x.id === me ? "me" : ""}" style="background:${colorOf(x.name || "?")}">
          ${x.id === host ? '<span class="crown">👑</span>' : ""}${esc((x.name || "?").trim().charAt(0).toUpperCase())}<span class="dot"></span>
        </div>
        <div>${esc(x.name || "?")}${x.id === me ? " (você)" : ""}</div>
      </div>`).join("") + (list.length <= 1 ? '<div class="waiting">Esperando o pessoal…</div>' : "");
    $("pdots").innerHTML = $("miniDots").innerHTML = list.slice(0, 5).map((x) => `<span style="background:${colorOf(x.name || "?")}">${x.id === host ? "<i>👑</i>" : ""}${esc((x.name || "?").trim().charAt(0).toUpperCase())}</span>`).join("");
    $("miniNames").textContent = list.length <= 1 ? "Esperando o pessoal…" : list.map((x) => (x.id === me ? "você" : x.name)).join(", ");
    renderChat();
  }
  // Só fotos de verdade (nada de link escondido na mensagem).
  const validImg = (d) => typeof d === "string" && /^data:image\/(jpeg|png|webp);base64,/.test(d) && /^[A-Za-z0-9+/=]+$/.test(d.slice(d.indexOf(",") + 1));
  let renderedKeys = [];
  function lineNode(l) {
    if (l.s) { const d = document.createElement("div"); d.className = "sys"; d.textContent = l.s.text; return d; }
    const m = l.m, mine = m.by === me, img = validImg(m.img) ? m.img : null;
    const wrap = document.createElement("div"); wrap.className = "msg" + (mine ? " mine" : "");
    const b = document.createElement("div"); b.className = "bubble" + (img ? " photo" : "");
    if (!mine) { const n = document.createElement("small"); n.style.color = colorOf(m.name || "?"); n.textContent = m.name || "?"; b.appendChild(n); }
    if (img) {
      const i = document.createElement("img"); i.src = img; i.alt = "Foto"; i.loading = "lazy";
      i.addEventListener("load", () => { const box = $("chat"); if (box.scrollHeight - box.scrollTop - box.clientHeight < 400) box.scrollTop = box.scrollHeight; });
      i.addEventListener("click", () => openViewer(img));
      b.appendChild(i);
    }
    if (m.text) { const t = document.createElement(img ? "div" : "span"); if (img) t.className = "cap"; t.textContent = m.text; b.appendChild(t); }
    wrap.appendChild(b);
    return wrap;
  }
  function renderChat() {
    const c = (tree && tree.chat) || {};
    const msgs = Object.entries(c).map(([id, m]) => ({ id, ...m })).sort((a, b) => (a.at || 0) - (b.at || 0) || a.id.localeCompare(b.id)).slice(-300);
    const lines = [...msgs.map((m) => ({ at: m.at || 0, key: "m" + m.id, m })), ...systemLines.map((s, i) => ({ at: s.at, key: "s" + i, s }))].sort((a, b) => a.at - b.at);
    const keys = lines.map((l) => l.key);
    if (keys.join("|") === renderedKeys.join("|")) return;
    const box = $("chat");
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    const appendOnly = renderedKeys.length > 0 && renderedKeys.every((k, i) => keys[i] === k);
    if (!lines.length) box.innerHTML = '<div class="empty">O chat da sala aparece aqui.</div>';
    else if (appendOnly) lines.slice(renderedKeys.length).forEach((l) => box.appendChild(lineNode(l)));
    else { box.textContent = ""; lines.forEach((l) => box.appendChild(lineNode(l))); }
    renderedKeys = keys;
    if (atBottom || (lines.at(-1)?.m?.by === me)) box.scrollTop = box.scrollHeight;
  }

  // ---------- Reações ----------
  const REACTIONS = ["😂", "😱", "❤️", "👏", "😭", "🍿"];
  const joinedAt = Date.now();
  const seenReactions = new Set();
  $("reacts").innerHTML = REACTIONS.map((e) => `<button type="button" aria-label="${e}">${e}</button>`).join("");
  $("reacts").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    if (joined) api("POST", "/reactions", { e: b.textContent, name: myName, by: me, at: SV }).catch(showConn);
  }));
  function renderReactions() {
    const r = (tree && tree.reactions) || {};
    for (const [id, x] of Object.entries(r)) {
      if (seenReactions.has(id)) continue;
      seenReactions.add(id);
      if (!REACTIONS.includes(x.e) || !x.at || x.at < serverNow() - 8000 || x.at < joinedAt + offset - 5000) continue;
      const el = document.createElement("div");
      el.className = "float";
      el.style.left = (12 + Math.random() * 70) + "%";
      el.innerHTML = `<b>${x.e}</b><span>${esc(x.name || "?")}</span>`;
      $("floats").appendChild(el);
      setTimeout(() => el.remove(), 2700);
    }
  }

  // ---------- Digitando ----------
  let typingSent = 0;
  function sendTyping(stopped) {
    if (!joined) return;
    if (stopped) { if (typingSent) { typingSent = 0; api("DELETE", `/typing/${me}`).catch(() => {}); } return; }
    if (Date.now() - typingSent < 2500) return;
    typingSent = Date.now();
    api("PUT", `/typing/${me}`, { name: myName, at: SV }).catch(() => {});
  }
  function renderTyping() {
    const t = (tree && tree.typing) || {};
    const names = Object.entries(t).filter(([id, x]) => id !== me && x && serverNow() - (x.at || 0) < 4000 && serverNow() - (x.at || 0) > -2000).map(([, x]) => x.name || "Alguém");
    const label = names.length === 0 ? "" : names.length === 1 ? `${names[0]} está digitando…` : `${names.slice(0, -1).join(", ")} e ${names.at(-1)} estão digitando…`;
    $("typingText").textContent = label;
    $("typing").classList.toggle("on", !!label);
  }
  setInterval(() => { if (joined) renderTyping(); }, 1000);

  // ---------- Fotos ----------
  function openViewer(src) { $("viewerImg").src = src; $("viewer").classList.add("show"); }
  $("viewerClose").addEventListener("click", () => $("viewer").classList.remove("show"));
  $("viewer").addEventListener("click", (e) => { if (e.target.id === "viewer") $("viewer").classList.remove("show"); });

  /** Reduz a foto (lado maior 1024 px, até ~180 KB) e devolve como texto para ir na mensagem. */
  async function shrink(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = url; });
      const scale = Math.min(1, 1024 / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(img.naturalWidth * scale)); cv.height = Math.max(1, Math.round(img.naturalHeight * scale));
      const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
      let q = 0.82, out;
      do { out = cv.toDataURL("image/jpeg", q); q -= 0.1; } while (out.length * 0.75 > 180000 && q >= 0.32);
      return out;
    } finally { URL.revokeObjectURL(url); }
  }
  $("file").addEventListener("change", async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f || !joined) return;
    $("pic").classList.add("busy");
    try {
      const data = await shrink(f);
      const caption = textInput.value.trim().slice(0, 500);
      textInput.value = ""; $("send").classList.remove("on");
      await api("POST", "/chat", { name: myName, text: caption, img: data, at: SV, by: me });
    } catch (_) { alert("Não consegui mandar essa foto."); }
    $("pic").classList.remove("busy");
  });

  const textInput = $("text");
  // O botão de enviar não "rouba" o foco: o teclado continua aberto depois de mandar.
  $("send").addEventListener("mousedown", (e) => e.preventDefault());
  $("send").addEventListener("pointerdown", (e) => e.preventDefault());
  textInput.addEventListener("input", () => sendTyping(!textInput.value.trim()));
  textInput.addEventListener("input", () => $("send").classList.toggle("on", !!textInput.value.trim()));
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const t = textInput.value.trim();
    if (!t) return;
    textInput.value = ""; $("send").classList.remove("on");
    sendTyping(true);
    textInput.focus();
    api("POST", "/chat", { name: myName, text: t.slice(0, 500), at: SV, by: me }).catch(showConn);
    $("chat").scrollTop = $("chat").scrollHeight;
  });

  // ---------- Conexão ----------
  function showConn(ok) {
    const s = $("sync");
    if (ok === true) { s.textContent = "sincronizado"; s.className = "sync ok"; }
    else { s.textContent = "reconectando…"; s.className = "sync off"; }
  }

  function onTree() {
    if (!loaded) return;
    if (!tree || !tree.video) {
      if (!joined) { $("joinText").textContent = "Sala não encontrada ou já encerrada. Peça um link novo."; $("enter").disabled = true; }
      return;
    }
    if (!joined) {
      $("joinText").innerHTML = `Você foi chamado para assistir <span class="movie">${esc(tree.video.title)}</span>. Como quer aparecer?`;
      $("enter").disabled = !$("name").value.trim();
      return;
    }
    const s = tree.state;
    if (s && s.by !== me) {
      const key = `${s.by}:${s.seq}:${s.at}`;
      if (key !== lastRemoteKey) { lastRemoteKey = key; applyRemote(s); }
    }
    renderPeople();
    renderReactions();
    renderTyping();
  }

  const es = new EventSource(`${ROOT}.json`);
  es.addEventListener("put", (e) => { applyEvent("put", JSON.parse(e.data)); loaded = true; showConn(true); onTree(); });
  es.addEventListener("patch", (e) => { applyEvent("patch", JSON.parse(e.data)); onTree(); });
  es.addEventListener("cancel", () => showConn(false));
  es.onerror = () => { showConn(false); if (!loaded) $("joinText").textContent = "Não consegui falar com a sala. Confira a internet."; };
  es.onopen = () => showConn(true);

  async function heartbeat() {
    try {
      const sent = Date.now();
      const r = await api("PUT", `/people/${me}`, { name: myName, lastSeen: SV, platform: "web" });
      const got = Date.now();
      if (r && r.lastSeen) offset = r.lastSeen - (sent + got) / 2;
      showConn(true);
    } catch (_) { showConn(false); }
  }

  // ---------- Teclado ----------
  // Celular (qualquer navegador): com a caixa de texto em foco, o layout vira o da referência —
  // player menor no topo, bolinhas por cima do vídeo, chat no meio e a caixa colada no teclado.
  // A sala acompanha só a área visível da tela; nada é mexido enquanto você digita.
  const vv = window.visualViewport;
  const room = $("room");
  const touch = matchMedia("(pointer: coarse)").matches || navigator.maxTouchPoints > 0;
  let lastH = -1, lastTop = -1, raf = 0;
  function fit() {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const h = Math.round(vv ? vv.height : innerHeight);
      const top = Math.round(vv ? Math.max(0, vv.offsetTop) : 0);
      if (Math.abs(h - lastH) > 1) { lastH = h; document.documentElement.style.setProperty("--vv-h", h + "px"); }
      if (Math.abs(top - lastTop) > 1) { lastTop = top; document.documentElement.style.setProperty("--vv-top", top + "px"); }
    });
  }
  /** Deitado = tela do aparelho mais larga que alta e baixinha (celular), independente do teclado. */
  function orient() {
    const sw = screen.width, sh = screen.height;
    const angle = (screen.orientation && screen.orientation.angle) || (typeof window.orientation === "number" ? window.orientation : 0);
    const landscape = Math.abs(angle) === 90 || (angle === 0 && sw > sh);
    document.body.classList.toggle("land", touch && landscape);
  }
  orient();
  addEventListener("orientationchange", () => setTimeout(() => { orient(); fit(); }, 200));
  if (screen.orientation) screen.orientation.addEventListener("change", () => { orient(); fit(); });

  function setKb(on) {
    if (!touch || on === document.body.classList.contains("kb")) return;
    document.body.classList.toggle("kb", on);
    fit();
    setTimeout(() => { $("chat").scrollTop = $("chat").scrollHeight; }, 60);
  }
  if (vv) { vv.addEventListener("resize", fit); vv.addEventListener("scroll", fit); }
  addEventListener("resize", fit);
  textInput.addEventListener("focus", () => setKb(true));
  // Pequena espera: ao enviar, o foco volta para a caixa e o layout não pisca.
  textInput.addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== textInput) setKb(false); }, 120));
  // Tocar no chat ou no vídeo fecha o teclado.
  ["chat", "video"].forEach((id) => $(id).addEventListener("touchstart", () => { if (document.activeElement === textInput) textInput.blur(); }, { passive: true }));
  // Página nunca rola (quem rola é só o chat).
  addEventListener("scroll", () => { if (document.body.classList.contains("in-room") && (scrollX || scrollY)) scrollTo(0, 0); }, { passive: true });

  // ---------- Entrar ----------
  $("name").addEventListener("input", () => { $("enter").disabled = !$("name").value.trim() || !tree || !tree.video; });
  $("name").addEventListener("keydown", (e) => { if (e.key === "Enter" && !$("enter").disabled) $("enter").click(); });
  $("enter").addEventListener("click", () => {
    myName = $("name").value.trim().slice(0, 24);
    if (!myName || !tree || !tree.video) return;
    localStorage.setItem("estante-nome", myName);
    const v = tree.video;
    $("movie").textContent = v.title;
    $("code").textContent = `Sala ${code}`;
    document.title = `${v.title} · Estante`;
    $("join").style.display = "none";
    room.style.display = "flex";
    room.classList.add("on");
    document.body.classList.add("in-room");
    fit();
    joined = true;
    Object.keys((tree && tree.reactions) || {}).forEach((id) => seenReactions.add(id));
    startSource(v);
    // Ainda dentro do toque em "Entrar": dá play já (o navegador libera som e play automático
    // para o resto da sessão). Se a sala estiver pausada, pausa assim que começar.
    const s0 = tree.state;
    lastState = s0 || null;
    if (s0) seekTo(expected(s0));
    mark("play");
    video.play().then(() => {
      unlocked = true;
      if (lastState && !lastState.playing) doPause();
      else if (lastState) seekTo(expected(lastState));
    }).catch((err) => {
      ignore.play = 0;
      if (lastState && lastState.playing) { if (err && err.name === "NotAllowedError") askTap(); else if (video.error) showVideoError(); }
    });
    heartbeat();
    setInterval(heartbeat, 10000);
    loadSubtitle(v);
    renderPeople();
  });

  addEventListener("pagehide", () => { if (joined) { api("DELETE", `/people/${me}`).catch(() => {}); api("DELETE", `/typing/${me}`).catch(() => {}); } });
  // Voltou para a aba: se reconecta e alcança a sala (sem reenviar nada).
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && joined) { heartbeat(); if (lastState && lastState.by !== me) applyRemote(lastState); } });
})();
</script>
</body>
</html>
